name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show environment
        run: |
          xcodebuild -version
          swift --version
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned .app
        run: |
          set -o pipefail
          xcodebuild \
            -project CarplayGauges.xcodeproj \
            -scheme CarplayGauges \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package .ipa
        run: |
          set -e
          PRODUCTS_DIR="build/Build/Products/Release-iphoneos"
          APP_PATH="$PRODUCTS_DIR/CarplayGauges.app"
          echo "Built app bundle contents:"
          find "$APP_PATH" -maxdepth 2

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          rm -f CarplayGauges.ipa
          zip -r -X CarplayGauges.ipa Payload
          echo "Produced IPA:"
          ls -la CarplayGauges.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarplayGauges-ipa
          path: CarplayGauges.ipa
          if-no-files-found: error
