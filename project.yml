name: CarplayGauges
options:
  bundleIdPrefix: com.potatogremlin.carplaygauges
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  usesTabs: false
  indentWidth: 4

configs:
  Debug: debug
  Release: release

settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  CarplayGauges:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Gauges
        excludes:
          - "Info.plist"
    resources:
      - path: Gauges/Assets.xcassets
    info:
      path: Gauges/Info.plist
      properties:
        CFBundleDisplayName: Carplay Gauges
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: "Carplay Gauges connects to your Bluetooth LE OBD2 adapter to read live engine data."
        NSBluetoothPeripheralUsageDescription: "Carplay Gauges connects to your Bluetooth LE OBD2 adapter to read live engine data."
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    dependencies:
      - target: GaugesWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.potatogremlin.carplaygauges
        PRODUCT_NAME: CarplayGauges
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  GaugesWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GaugesWidget
        excludes:
          - "Info.plist"
      - path: Gauges/Shared
    resources:
      - path: GaugesWidget/Assets.xcassets
    info:
      path: GaugesWidget/Info.plist
      properties:
        CFBundleDisplayName: Gauges Widget
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.potatogremlin.carplaygauges.widget
        PRODUCT_NAME: GaugesWidget
        SKIP_INSTALL: YES

schemes:
  CarplayGauges:
    build:
      targets:
        CarplayGauges: all
        GaugesWidgetExtension: all
      parallelizeBuild: true
    run:
      config: Debug
    archive:
      config: Release
